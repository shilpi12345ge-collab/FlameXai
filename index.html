<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Universal AI Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              bg: '#f8fafd',
              darkBg: '#131314',
              sidebarLight: '#f0f4f9',
              sidebarDark: '#1e1f20',
              cardDark: '#282a2c',
              accent: '#1a73e8',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Marked.js CDN for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Mobile-first viewport height fixes */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .app-height {
      height: 100vh;
      height: 100dvh;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.5);
    }
    /* Markdown code styles */
    .prose pre {
      background-color: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .prose code {
      font-family: monospace;
      background-color: rgba(175, 184, 193, 0.2);
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }
    .prose pre code {
      background-color: transparent;
      padding: 0;
    }
  </style>
</head>
<body class="bg-gemini-bg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-100 font-sans antialiased">

  <!-- Fallback Initial Loader -->
  <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white dark:bg-gemini-darkBg text-gray-600 dark:text-gray-300">
    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-lg font-medium">Initializing Application...</div>
  </div>

  <!-- Main Container -->
  <div id="app" class="app-height flex w-full overflow-hidden opacity-0 transition-opacity duration-300">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-72 bg-gemini-sidebarLight dark:bg-gemini-sidebarDark flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-gray-200 dark:border-gray-800">
      
      <!-- Top Action Bar -->
      <div class="p-4 flex items-center justify-between">
        <button onclick="createNewChat()" class="flex items-center gap-2 bg-white dark:bg-gemini-cardDark hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium py-2.5 px-4 rounded-full shadow-sm border border-gray-200 dark:border-gray-700 transition w-full justify-start">
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>New Chat</span>
        </button>
        <button onclick="toggleSidebar(false)" class="lg:hidden p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Chat History List -->
      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Footer / Controls -->
      <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-1">
        <button onclick="openModal('system-modal')" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          <span>System Prompt</span>
        </button>

        <button onclick="openModal('settings-modal')" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Settings</span>
        </button>

        <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition">
          <svg id="theme-icon-dark" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="theme-icon-light" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <span id="theme-label">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-white dark:bg-gemini-darkBg relative">
      
      <!-- Top Mobile Header -->
      <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800 lg:hidden">
        <button onclick="toggleSidebar(true)" class="p-2 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="mobile-chat-title" class="text-base font-medium truncate px-2">Universal AI</h1>
        <button onclick="createNewChat()" class="p-2 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
      </header>

      <!-- Messages Viewport -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <!-- Rendered dynamically -->
      </div>

      <!-- Floating Bottom Input Area -->
      <div class="p-3 md:p-4 bg-white dark:bg-gemini-darkBg border-t border-gray-100 dark:border-gray-800/50">
        <div class="max-w-3xl mx-auto relative">
          <form id="chat-form" onsubmit="handleSendMessage(event)" class="relative flex items-end bg-gray-100 dark:bg-gemini-cardDark rounded-2xl border border-transparent focus-within:border-gray-300 dark:focus-within:border-gray-600 transition px-4 py-2.5">
            <textarea 
              id="user-input" 
              rows="1" 
              placeholder="Message AI..." 
              class="w-full bg-transparent border-0 resize-none focus:outline-none focus:ring-0 max-h-32 text-gray-900 dark:text-gray-100 text-base pr-10"
              onkeydown="handleKeyDown(event)"
              oninput="autoResizeTextarea(this)"
            ></textarea>
            <button type="submit" id="send-btn" class="absolute right-3 bottom-2.5 p-1.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
            </button>
          </form>
          <div class="text-xs text-center text-gray-400 dark:text-gray-500 mt-2">
            AI can make mistakes. Verify important info.
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gemini-cardDark rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 dark:border-gray-700 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">API Settings</h3>
        <button onclick="closeModal('settings-modal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OpenRouter API Key</label>
        <input type="password" id="setting-api-key" placeholder="sk-or-v1-..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gemini-darkBg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model Name</label>
        <input type="text" id="setting-model" placeholder="deepseek/deepseek-r1:free" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gemini-darkBg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal('settings-modal')" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <!-- System Prompt Modal -->
  <div id="system-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gemini-cardDark rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 dark:border-gray-700 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">System Prompt</h3>
        <button onclick="closeModal('system-modal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div>
        <textarea id="system-prompt-input" rows="5" placeholder="You are a helpful assistant..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gemini-darkBg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal('system-modal')" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
        <button onclick="saveSystemPrompt()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // State management
    const DEFAULT_MODEL = 'deepseek/deepseek-r1:free';
    const DEFAULT_SYSTEM = 'You are a helpful, smart, and precise AI assistant.';

    let appState = {
      apiKey: '',
      model: DEFAULT_MODEL,
      systemPrompt: DEFAULT_SYSTEM,
      darkMode: false,
      chats: [],
      currentChatId: null,
      isGenerating: false
    };

    // Safe Initialization
    document.addEventListener('DOMContentLoaded', () => {
      try {
        loadLocalStorage();
        initTheme();
        if (appState.chats.length === 0) {
          createNewChat(false);
        } else if (!appState.currentChatId) {
          appState.currentChatId = appState.chats[0].id;
        }
        renderChatList();
        renderMessages();
      } catch (err) {
        console.error('Initialization error:', err);
      } finally {
        // Hide loader safely
        const loader = document.getElementById('loading');
        const app = document.getElementById('app');
        if (loader) loader.classList.add('hidden');
        if (app) app.classList.remove('opacity-0');
      }
    });

    // LocalStorage Operations
    function loadLocalStorage() {
      appState.apiKey = localStorage.getItem('ai_api_key') || '';
      appState.model = localStorage.getItem('ai_model') || DEFAULT_MODEL;
      appState.systemPrompt = localStorage.getItem('ai_system_prompt') || DEFAULT_SYSTEM;
      appState.darkMode = localStorage.getItem('ai_dark_mode') === 'true';
      
      const savedChats = localStorage.getItem('ai_chats');
      appState.chats = savedChats ? JSON.parse(savedChats) : [];
      appState.currentChatId = localStorage.getItem('ai_current_chat_id') || null;
    }

    function saveState() {
      localStorage.setItem('ai_api_key', appState.apiKey);
      localStorage.setItem('ai_model', appState.model);
      localStorage.setItem('ai_system_prompt', appState.systemPrompt);
      localStorage.setItem('ai_dark_mode', appState.darkMode);
      localStorage.setItem('ai_chats', JSON.stringify(appState.chats));
      if (appState.currentChatId) {
        localStorage.setItem('ai_current_chat_id', appState.currentChatId);
      }
    }

    // Theme Toggle
    function initTheme() {
      if (appState.darkMode) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon-dark').classList.remove('hidden');
        document.getElementById('theme-icon-light').classList.add('hidden');
        document.getElementById('theme-label').textContent = 'Light Mode';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon-dark').classList.add('hidden');
        document.getElementById('theme-icon-light').classList.remove('hidden');
        document.getElementById('theme-label').textContent = 'Dark Mode';
      }
    }

    function toggleDarkMode() {
      appState.darkMode = !appState.darkMode;
      initTheme();
      saveState();
    }

    // UI Drawer Handlers
    function toggleSidebar(show) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (show) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // Modal Control
    function openModal(id) {
      if (id === 'settings-modal') {
        document.getElementById('setting-api-key').value = appState.apiKey;
        document.getElementById('setting-model').value = appState.model;
      } else if (id === 'system-modal') {
        document.getElementById('system-prompt-input').value = appState.systemPrompt;
      }
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function saveSettings() {
      appState.apiKey = document.getElementById('setting-api-key').value.trim();
      appState.model = document.getElementById('setting-model').value.trim() || DEFAULT_MODEL;
      saveState();
      closeModal('settings-modal');
    }

    function saveSystemPrompt() {
      appState.systemPrompt = document.getElementById('system-prompt-input').value.trim() || DEFAULT_SYSTEM;
      saveState();
      closeModal('system-modal');
    }

    // Chat Actions
    function createNewChat(shouldRender = true) {
      const newChat = {
        id: Date.now().toString(),
        title: 'New Conversation',
        messages: []
      };
      appState.chats.unshift(newChat);
      appState.currentChatId = newChat.id;
      saveState();

      if (shouldRender) {
        renderChatList();
        renderMessages();
        toggleSidebar(false);
      }
    }

    function getCurrentChat() {
      return appState.chats.find(c => c.id === appState.currentChatId);
    }

    function selectChat(id) {
      appState.currentChatId = id;
      saveState();
      renderChatList();
      renderMessages();
      toggleSidebar(false);
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      appState.chats = appState.chats.filter(c => c.id !== id);
      if (appState.currentChatId === id) {
        appState.currentChatId = appState.chats.length ? appState.chats[0].id : null;
      }
      if (!appState.currentChatId) {
        createNewChat(false);
      }
      saveState();
      renderChatList();
      renderMessages();
    }

    function renameChat(id, event) {
      event.stopPropagation();
      const chat = appState.chats.find(c => c.id === id);
      if (!chat) return;
      const newTitle = prompt('Rename chat:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveState();
        renderChatList();
        renderMessages();
      }
    }

    // Rendering Engine
    function renderChatList() {
      const container = document.getElementById('chat-list');
      container.innerHTML = '';

      appState.chats.forEach(chat => {
        const isActive = chat.id === appState.currentChatId;
        const el = document.createElement('div');
        el.className = `group relative flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm font-medium transition ${
          isActive 
            ? 'bg-gray-200/70 dark:bg-gray-800 text-gray-900 dark:text-white' 
            : 'text-gray-700 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50'
        }`;
        el.onclick = () => selectChat(chat.id);

        el.innerHTML = `
          <div class="flex items-center gap-2.5 truncate pr-2">
            <svg class="w-4 h-4 shrink-0 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <div class="hidden group-hover:flex items-center gap-1">
            <button onclick="renameChat('${chat.id}', event)" class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-white">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            </button>
            <button onclick="deleteChat('${chat.id}', event)" class="p-1 text-gray-400 hover:text-red-500">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function renderMessages() {
      const chat = getCurrentChat();
      const container = document.getElementById('messages-container');
      const mobileTitle = document.getElementById('mobile-chat-title');
      
      container.innerHTML = '';
      if (!chat) return;

      mobileTitle.textContent = chat.title || 'Universal AI';

      if (chat.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4">
            <div class="w-16 h-16 rounded-full bg-blue-50 dark:bg-gemini-cardDark flex items-center justify-center text-blue-500 font-semibold text-xl">✨</div>
            <h2 class="text-2xl font-medium text-gray-800 dark:text-gray-200">How can I help you today?</h2>
          </div>
        `;
        return;
      }

      chat.messages.forEach(msg => {
        appendMessageUI(msg.role, msg.content);
      });

      scrollToBottom();
    }

    function appendMessageUI(role, content) {
      const container = document.getElementById('messages-container');
      const isUser = role === 'user';
      
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-3 md:gap-4 max-w-3xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}`;

      const formattedContent = typeof marked !== 'undefined' ? marked.parse(content) : escapeHtml(content);

      if (isUser) {
        wrapper.innerHTML = `
          <div class="bg-gray-100 dark:bg-gemini-cardDark text-gray-900 dark:text-gray-100 px-4 py-3 rounded-2xl max-w-[85%] sm:max-w-[75%] shadow-sm">
            <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(content)}</p>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-semibold shrink-0 mt-1">AI</div>
          <div class="prose dark:prose-invert max-w-none flex-1 text-gray-800 dark:text-gray-200 leading-relaxed overflow-hidden">
            ${formattedContent}
          </div>
        `;
      }

      container.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    // Input Handling
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chat-form').requestSubmit();
      }
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    // Streaming API Processing
    async function handleSendMessage(e) {
      e.preventDefault();
      if (appState.isGenerating) return;

      const inputEl = document.getElementById('user-input');
      const promptText = inputEl.value.trim();
      if (!promptText) return;

      if (!appState.apiKey) {
        openModal('settings-modal');
        alert('Please enter your OpenRouter API Key first.');
        return;
      }

      const chat = getCurrentChat();
      if (!chat) return;

      // Update Title if First Message
      if (chat.messages.length === 0) {
        chat.title = promptText.slice(0, 30);
        renderChatList();
      }

      // Append User Message
      chat.messages.push({ role: 'user', content: promptText });
      inputEl.value = '';
      autoResizeTextarea(inputEl);
      renderMessages();

      // Lock UI
      appState.isGenerating = true;
      document.getElementById('send-btn').disabled = true;

      // Create AI Response Wrapper UI
      const container = document.getElementById('messages-container');
      const responseWrapper = document.createElement('div');
      responseWrapper.className = 'flex gap-3 md:gap-4 max-w-3xl mx-auto justify-start';
      responseWrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-semibold shrink-0 mt-1">AI</div>
        <div class="prose dark:prose-invert max-w-none flex-1 text-gray-800 dark:text-gray-200 leading-relaxed overflow-hidden message-content">
          <span class="inline-block w-2 h-4 bg-gray-400 animate-pulse"></span>
        </div>
      `;
      container.appendChild(responseWrapper);
      scrollToBottom();

      const messageContentEl = responseWrapper.querySelector('.message-content');
      let fullResponse = '';

      try {
        const payloadMessages = [
          { role: 'system', content: appState.systemPrompt },
          ...chat.messages.map(m => ({ role: m.role, content: m.content }))
        ];

        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${appState.apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Universal AI Chat'
          },
          body: JSON.stringify({
            model: appState.model,
            messages: payloadMessages,
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status} Error`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              const dataStr = trimmed.replace('data: ', '');
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                const delta = parsed.choices?.[0]?.delta?.content || '';
                fullResponse += delta;
                messageContentEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(fullResponse) : escapeHtml(fullResponse);
                scrollToBottom();
              } catch (err) {
                // Ignore parse errors for partial chunks
              }
            }
          }
        }

        // Save AI response
        chat.messages.push({ role: 'assistant', content: fullResponse });
        saveState();

      } catch (err) {
        console.error('API Stream Error:', err);
        messageContentEl.innerHTML = `<span class="text-red-500">Error: ${escapeHtml(err.message)}</span>`;
      } finally {
        appState.isGenerating = false;
        document.getElementById('send-btn').disabled = false;
      }
    }

    // Helper utilities
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
